name: verify

on:
  push:
  pull_request:

jobs:
  build-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start preview
        run: npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/prism-vite.log 2>&1 &
      - name: Wait for preview
        run: node -e "let n=0;const ping=()=>fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)throw Error(r.status)}).catch(e=>{if(++n>30)throw e;setTimeout(ping,500)});ping()"
      - name: Run interaction suite
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:ui
